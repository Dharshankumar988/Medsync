[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -p no:pytest_ethereum --ignore=venv_wsl --ignore=.venv_local --ignore=venv_dev --ignore=venv_test --ignore=tests/integration --ignore=tests/test_local_gateway_real.py --ignore=tests/test_local_integration.py --ignore=tests/test_access_control.py --ignore=tests/load_test.py
norecursedirs = venv* .venv*
timeout = 30
pythonpath = .
