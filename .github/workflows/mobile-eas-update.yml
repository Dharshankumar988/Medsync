name: MedSync Mobile EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Over-The-Air Update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🚀 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🏗 Build Core Package
        run: pnpm --filter @medsync/core build

      - name: 🔍 TypeScript Validation
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: 📲 Publish Over-The-Air Update to Preview and Production
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning title=Missing EXPO_TOKEN::EXPO_TOKEN secret is not configured in GitHub repository secrets. Skipping EAS Over-The-Air update. To enable automatic OTA updates, generate a token at https://expo.dev/accounts/[your-username]/settings/access-tokens and add it as EXPO_TOKEN in GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          eas update --auto --channel preview --message "Auto OTA update from commit ${{ github.sha }}"
          eas update --auto --channel production --message "Auto OTA update from commit ${{ github.sha }}"
