name: MedSync Mobile EAS Update

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Over-The-Air Update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 🚀 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: 🏗 Build Core Package
        run: pnpm --filter @medsync/core build

      - name: 🔍 TypeScript Validation
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: 📲 Publish Over-The-Air Update to Preview and Production
        working-directory: apps/mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Missing EXPO_TOKEN::Neither EXPO_TOKEN nor EAS_TOKEN secret was found in GitHub repository secrets. Over-the-air updates cannot be published to EAS without an access token. Please create an access token at https://expo.dev/accounts/[your-account]/settings/access-tokens and add it as EXPO_TOKEN in your GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          eas update --branch preview --non-interactive --message "Auto OTA update from commit ${{ github.sha }}"
          eas update --branch production --non-interactive --message "Auto OTA update from commit ${{ github.sha }}"
