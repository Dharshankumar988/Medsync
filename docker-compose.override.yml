services:
  backend:
    build: 
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      - FACE_VERIFICATION_URL=http://face_service:8080
      - BLOCKCHAIN_MODE=mock
    depends_on:
      face_service:
        condition: service_healthy

  face_service:
    build:
      context: ./apps/face-service
      dockerfile: Dockerfile
    container_name: medsync_face_service
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - FACE_VERIFICATION_AUTH_TOKEN=local_dev_token_123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
