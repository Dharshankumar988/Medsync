version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medsync_backend
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      # Ensure you copy apps/backend/.env.example to apps/backend/.env
      - PYTHONUNBUFFERED=1
      - PINATA_JWT=${PINATA_JWT}
    env_file:
      - ./apps/backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
